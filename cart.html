<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VELOCITY - Shopping Cart</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body
    class="bg-gradient-to-b from-[#151C24] via-[#0B0F14] to-[#0B0F14] text-[#F5F5F5]"
  >
    <!-- Navbar -->
    <nav
      class="flex items-center justify-between border-b border-white/10 bg-[#151C24] px-4 py-3 shadow-lg"
    >
      <!-- Logo -->
      <a href="index.html">
        <img src="images/logo.png" alt="VELOCITY Logo" class="h-20 w-auto" />
      </a>

      <!-- Login & Register -->
      <div id="links" class="ml-auto flex items-center gap-2">
        <a
          href="login.html"
          class="rounded border border-[#FF5A1F] px-3 py-[6px] text-[#FF5A1F] transition-colors hover:bg-[#FF5A1F] hover:text-white"
        >
          Login
        </a>

        <a
          href="register.html"
          class="rounded border border-[#FF5A1F] bg-[#FF5A1F] px-3 py-[6px] text-white transition-colors hover:border-[#E64A19] hover:bg-[#E64A19]"
        >
          Register
        </a>
      </div>

      <!-- User Info -->
      <div
        id="user_info"
        class="ml-auto hidden flex-row items-center gap-6 whitespace-nowrap"
      >
        <!-- Hello -->
        <span id="user" class="text-base font-medium text-white"></span>

        <!-- Cart Dropdown -->
        <div class="relative mx-4">
          <button
            onclick="toggleCartDropdown()"
            class="relative flex items-center text-[#FF5A1F] transition-colors hover:text-[#FF8A50]"
          >
            <i class="fas fa-shopping-cart text-2xl"></i>

            <span
              id="cart-count"
              class="absolute -top-3 left-1/2 -translate-x-1/6 flex size-[16px] items-center justify-center rounded-full bg-[#FF5A1F] text-xs font-semibold text-white"
            >
            </span>
          </button>

          <div
            id="cart-dropdown"
            class="absolute right-[-120px] top-full z-50 mt-2 hidden w-[200px] rounded-lg border border-white/10 bg-[#1C2732] p-2 shadow-xl shadow-black/30"
          >
            <div id="cart-dropdown-items"></div>

            <a
              href="cart.html"
              class="block border-t border-white/10 px-3 py-3 text-center text-[#F5F5F5] transition-colors hover:bg-[#FF5A1F] hover:text-white"
            >
              View All Products
            </a>
          </div>
        </div>

        <!-- Logout -->
        <a
          href="index.html"
          onclick="logout()"
          class="rounded border border-[#FF5A1F] px-3 py-[6px] text-[#FF5A1F] transition-colors hover:bg-[#FF5A1F] hover:text-white"
        >
          Logout
        </a>
      </div>
    </nav>

    <!-- Cart Section -->
    <section class="mx-auto px-5 pt-16 pb-8 lg:px-[80px]">
      <!-- Title -->
      <div class="group mb-10">
        <h2
          class="mx-auto w-fit px-20 pb-3 text-3xl font-semibold text-[#F5F5F5]"
        >
          Shopping Cart
        </h2>

        <p
          class="mx-auto h-[2px] w-60 bg-[#FF5A1F] transition-all duration-300 group-hover:w-2/4"
        ></p>
      </div>

      <!-- Cart Products -->
      <div
        id="cart-items"
        class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:gap-10"
      ></div>

      <!-- Total Price -->
      <div class="mt-12 text-center">
        <h3 class="text-3xl font-semibold text-[#F5F5F5]">
          Total Price: <span id="totalPrice">0.00</span> EGP
        </h3>

        <!-- Continue Shopping -->
        <a
          href="index.html"
          class="mt-6 inline-block rounded border border-[#FF5A1F] bg-[#FF5A1F] px-6 py-3 text-base font-medium text-white transition-colors hover:border-[#E64A19] hover:bg-[#E64A19]"
        >
          <i class="fas fa-arrow-left mr-2"></i>
          Continue Shopping
        </a>
      </div>
    </section>

    <!-- Favorite Items Section -->
    <section class="border-t border-white/10 px-6 pt-8 pb-16">
      <!-- Title -->
      <div class="group mb-6">
        <h2
          class="mx-auto w-fit px-20 pb-3 text-3xl font-semibold text-[#F5F5F5]"
        >
          Favorite Items
        </h2>

        <p
          class="mx-auto h-[2px] w-60 bg-[#FF5A1F] transition-all duration-300 group-hover:w-2/4"
        ></p>
      </div>

      <!-- Favorite Products -->
      <div
        id="favorite-items"
        class="mx-auto grid w-full grid-cols-1 justify-center gap-5 sm:grid-cols-2 lg:grid-cols-[repeat(3,300px)]"
      ></div>
    </section>

    <script src="JS/script.js"></script>
  </body>
</html>
