<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VELOCITY - Automotive Accessories</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body
    class="bg-gradient-to-b from-[#151C24] via-[#0B0F14] to-[#0B0F14] text-[#F5F5F5]"
  >
    <!-- Navbar -->
    <nav
      class="flex items-center justify-between border-b border-white/10 bg-[#151C24] px-4 py-3 shadow-lg"
    >
      <!-- Logo -->
      <a href="index.html">
        <img src="images/logo.png" alt="VELOCITY Logo" class="h-20 w-auto" />
      </a>

      <!-- Login & Register -->
      <div id="links" class="ml-auto flex items-center gap-2">
        <a
          href="login.html"
          class="rounded border border-[#FF5A1F] px-3 py-[6px] text-[#FF5A1F] transition-colors hover:bg-[#FF5A1F] hover:text-white"
        >
          Login
        </a>

        <a
          href="register.html"
          class="rounded border border-[#FF5A1F] bg-[#FF5A1F] px-3 py-[6px] text-white transition-colors hover:border-[#E64A19] hover:bg-[#E64A19]"
        >
          Register
        </a>
      </div>

      <!-- User Info -->
      <div
        id="user_info"
        class="ml-auto hidden flex-row items-center gap-6 whitespace-nowrap"
      >
        <!-- Hello -->
        <span id="user" class="text-base font-medium text-white"></span>

        <!-- Cart Dropdown -->
        <div class="relative mx-4">
          <button
            onclick="toggleCartDropdown()"
            class="relative flex items-center text-[#FF5A1F] transition-colors hover:text-[#FF8A50]"
          >
            <i class="fas fa-shopping-cart text-2xl"></i>

            <span
              id="cart-count"
              class="absolute -top-3 left-1/2 -translate-x-1/6 flex size-[16px] items-center justify-center rounded-full bg-[#FF5A1F] text-xs font-semibold text-white"
            >
            </span>
          </button>

          <div
            id="cart-dropdown"
            class="absolute right-[-120px] top-full z-50 mt-2 hidden w-[200px] rounded-lg border border-white/10 bg-[#1C2732] p-2 shadow-xl shadow-black/30"
          >
            <div id="cart-dropdown-items"></div>

            <a
              href="cart.html"
              class="block border-t border-white/10 px-3 py-3 text-center text-[#F5F5F5] transition-colors hover:bg-[#FF5A1F] hover:text-white"
            >
              View All Products
            </a>
          </div>
        </div>
        <!-- Logout -->
        <a
          href="index.html"
          onclick="logout()"
          class="rounded border border-[#FF5A1F] px-3 py-[6px] text-[#FF5A1F] transition-colors hover:bg-[#FF5A1F] hover:text-white"
        >
          Logout
        </a>
      </div>
    </nav>
    <!-- Search Section -->
    <div
      class="mx-auto mt-6 box-border w-full px-[15px] min-[576px]:max-w-[540px] min-[768px]:max-w-[720px] min-[992px]:max-w-[960px] min-[1200px]:max-w-[1140px]"
    >
      <div class="-mx-[15px] flex flex-wrap">
        <div class="w-full px-[15px] md:w-1/4">
          <select
            id="searchType"
            class="block h-[38px] w-full rounded border border-white/10 bg-[#1C2732] px-3 py-[6px] text-base text-white outline-none transition focus:border-[#FF5A1F] focus:ring-2 focus:ring-[#FF5A1F]/20"
          >
            <option value="name">Search by Product Name</option>
            <option value="category">Search by Category</option>
          </select>
        </div>

        <div class="w-full px-[15px] md:w-[58.333333%]">
          <input
            type="text"
            id="searchBox"
            placeholder="Search..."
            onkeyup="searchProducts()"
            class="block h-[38px] w-full rounded border border-white/10 bg-[#1C2732] px-3 py-[6px] text-base text-white outline-none placeholder:text-gray-400 transition focus:border-[#FF5A1F] focus:ring-2 focus:ring-[#FF5A1F]/20"
          />
        </div>

        <div class="w-full px-[15px] md:w-[16.666667%]">
          <button
            type="button"
            onclick="searchProducts()"
            class="block h-[38px] w-full rounded border border-[#FF5A1F] bg-[#FF5A1F] px-3 py-[6px] text-base text-white transition-colors hover:border-[#E64A19] hover:bg-[#E64A19]"
          >
            Search
          </button>
        </div>
      </div>
    </div>

    <!-- Products Section -->
    <section
      class="mx-auto mt-[50px] mb-6 w-full px-[15px] min-[576px]:max-w-[540px] min-[768px]:max-w-[720px] min-[992px]:max-w-[960px] min-[1200px]:max-w-[1140px]"
    >
      <!-- Section Heading -->
      <div class="mb-8 text-center">
        <h2 class="text-3xl font-bold tracking-wide text-white md:text-4xl">
          EXPLORE OUR <span class="text-[#FF5A1F]">PRODUCTS</span>
        </h2>

        <p class="mt-3 text-sm text-gray-400 md:text-base">
          Find the perfect accessories for your drive.
        </p>

        <div class="mx-auto mt-4 h-1 w-16 rounded-full bg-[#FF5A1F]"></div>
      </div>

      <!-- Products -->
      <div
        id="products-container"
        class="grid grid-cols-1 gap-[30px] md:grid-cols-3"
      ></div>
    </section>

    <script src="JS/script.js"></script>
  </body>
</html>
