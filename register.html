<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VELOCITY - Register</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="CSS/all.css" />
  </head>

  <body
    class="min-h-screen bg-gradient-to-b from-[#151C24] via-[#0B0F14] to-[#0B0F14] text-[#F5F5F5]"
  >
    <!-- Navbar -->
    <nav
      class="flex items-center justify-between border-b border-white/10 bg-[#151C24] px-4 py-3 shadow-lg"
    >
      <a href="index.html">
        <img src="images/logo.png" alt="VELOCITY Logo" class="h-20 w-auto" />
      </a>
    </nav>

    <!-- Register Form -->
    <div class="mx-auto mt-12 w-full max-w-[1140px] px-[15px]">
      <div
        class="rounded-lg border border-white/10 bg-[#1C2732] p-8 shadow-[0_0_15px_rgba(0,0,0,0.3)]"
      >
        <form id="registerForm">
          <!-- First Name & Last Name -->
          <div class="mb-4 grid grid-cols-2 gap-[14px]">
            <div>
              <label
                for="firstName"
                class="mb-2 block text-base text-[#F5F5F5]"
              >
                First Name
              </label>

              <input
                type="text"
                id="firstName"
                placeholder="Enter first name"
                required
                class="block h-[38px] w-full rounded border border-white/10 bg-[#0B0F14] px-3 py-[6px] text-base leading-6 text-white outline-none placeholder:text-gray-400 focus:border-[#FF5A1F] focus:shadow-[0_0_0_3px_rgba(255,90,31,0.2)]"
              />
            </div>

            <div>
              <label for="lastName" class="mb-2 block text-base text-[#F5F5F5]">
                Last Name
              </label>

              <input
                type="text"
                id="lastName"
                placeholder="Enter last name"
                required
                class="block h-[38px] w-full rounded border border-white/10 bg-[#0B0F14] px-3 py-[6px] text-base leading-6 text-white outline-none placeholder:text-gray-400 focus:border-[#FF5A1F] focus:shadow-[0_0_0_3px_rgba(255,90,31,0.2)]"
              />
            </div>
          </div>

          <!-- Email -->
          <div class="mb-4">
            <label for="email" class="mb-2 block text-base text-[#F5F5F5]">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter email"
              required
              class="block h-[38px] w-full rounded border border-white/10 bg-[#0B0F14] px-3 py-[6px] text-base leading-6 text-white outline-none placeholder:text-gray-400 focus:border-[#FF5A1F] focus:shadow-[0_0_0_3px_rgba(255,90,31,0.2)]"
            />
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label for="password" class="mb-2 block text-base text-[#F5F5F5]">
              Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Enter password"
              required
              class="block h-[38px] w-full rounded border border-white/10 bg-[#0B0F14] px-3 py-[6px] text-base leading-6 text-white outline-none placeholder:text-gray-400 focus:border-[#FF5A1F] focus:shadow-[0_0_0_3px_rgba(255,90,31,0.2)]"
            />
          </div>

          <!-- Register Button -->
          <input
            type="submit"
            value="Register"
            id="Register"
            class="rounded border border-[#FF5A1F] bg-[#FF5A1F] px-3 py-[6px] text-base leading-6 text-white transition-colors hover:border-[#E64A19] hover:bg-[#E64A19]"
          />

          <!-- Login Link -->
          <p class="mt-3 text-base text-[#F5F5F5]">
            Have an account?

            <a href="login.html" class="text-[#FF5A1F] hover:underline">
              Login
            </a>
          </p>
        </form>
      </div>
    </div>

    <script src="js/Register.js"></script>
  </body>
</html>
